[project]
name = "curia-maxima"
version = "0.1.0"
description = "Herramientas de la cámara cívica curia_maxima"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pyyaml>=6.0.2"]
sitio = ["pyyaml>=6.0.2"]

[project.scripts]
curia-collect = "curia_maxima.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
curia_maxima = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["curia_maxima"]
